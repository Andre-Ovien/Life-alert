components:
  schemas:
    APIError:
      type: object
      description: Permission, authentication, validation or throttling error; field
        keys vary by input.
      additionalProperties: true
    AssignmentTransition:
      enum:
      - accepted
      - declined
      - en_route
      - arrived
      - complete
      type: string
      description: |-
        * `accepted` - accepted
        * `declined` - declined
        * `en_route` - en_route
        * `arrived` - arrived
        * `complete` - complete
    AssignmentTransitionRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
        target:
          $ref: '#/components/schemas/AssignmentTransition'
      required:
      - target
    AudienceEnum:
      enum:
      - guardian
      - coordinator
      type: string
      description: |-
        * `guardian` - guardian
        * `coordinator` - coordinator
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        device_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        object_id:
          type: string
          format: uuid
          readOnly: true
        facts:
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - device_id
      - facts
      - id
      - object_id
    Authority:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        child:
          type: string
          format: uuid
        subject:
          type: integer
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/AuthorityStatusEnum'
          readOnly: true
        evidence_reference:
          type: string
          maxLength: 200
        verification_reference:
          type: string
          readOnly: true
        verified_by:
          type: integer
          readOnly: true
          nullable: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
      required:
      - child
      - evidence_reference
      - id
      - purpose
      - status
      - subject
      - verification_reference
      - verified_at
      - verified_by
    AuthorityRequest:
      type: object
      properties:
        child:
          type: string
          format: uuid
        subject:
          type: integer
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        evidence_reference:
          type: string
          minLength: 1
          maxLength: 200
        valid_until:
          type: string
          format: date-time
          nullable: true
      required:
      - child
      - evidence_reference
      - purpose
      - subject
    AuthorityStatusEnum:
      enum:
      - pending
      - verified
      - revoked
      type: string
      description: |-
        * `pending` - pending
        * `verified` - verified
        * `revoked` - revoked
